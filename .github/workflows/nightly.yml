name: Build nightly

on:
  schedule:
    - cron: "10 12 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: 'Base name from bases.json, or all'
        required: false
        default: all

concurrency:
  group: build-nightly
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.prepare.outputs.build }}
      version: ${{ steps.prepare.outputs.version }}
      latest: ${{ steps.prepare.outputs.latest }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test publication logic
        run: prove scripts/*.t
      - name: Select bases
        id: prepare
        env:
          CHANNEL: nightly
          INPUT_BASE: ${{ inputs.base }}
        run: perl scripts/release.pl prepare

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    uses: ./.github/workflows/base.yml
    permissions:
      contents: read
      packages: write
    with:
      base: ${{ matrix.name }}
      image: ${{ matrix.image }}
      version: ${{ needs.check.outputs.version }}
      latest: ${{ needs.check.outputs.latest == 'true' }}
