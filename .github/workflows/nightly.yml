name: Build nightly

on:
  schedule:
    # 20:10 China Standard Time / 21:10 Japan Standard Time.
    - cron: "10 12 * * *"
  workflow_dispatch:

concurrency:
  group: build-nightly
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/moonbit

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # nightly is mutable: always download the current toolchain.
          no-cache: true
          pull: true
          platforms: linux/${{ matrix.arch }}
          build-args: |
            MOONBIT_VERSION=nightly
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Unofficial MoonBit toolchain image
            org.opencontainers.image.version=nightly
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The digest is already pushed but untagged; failing here stops publish
      # from tagging it.
      - name: Smoke test
        env:
          ENGINE: docker
          DIGEST: ${{ steps.build.outputs.digest }}
        run: ./test.sh "$IMAGE@$DIGEST"

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          # Use the UTC publication date, including for manual reruns.
          dated_tag="nightly-$(date -u +%Y%m%d)"
          repository=${IMAGE#ghcr.io/}
          # Anonymous pull access is sufficient for this public package.
          token=$(curl -fsS --get https://ghcr.io/token \
            --data-urlencode service=ghcr.io \
            --data-urlencode "scope=repository:$repository:pull" \
            | jq -er '.token | select(type == "string" and length > 0)')
          status=$(curl -sS --head --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/$repository/manifests/$dated_tag")
          tags=(-t "$IMAGE:nightly")
          case "$status" in
            200) echo "$dated_tag already exists; preserving it" ;;
            404) tags+=(-t "$IMAGE:$dated_tag") ;;
            *)
              echo "::error::Cannot check $dated_tag: HTTP $status"
              exit 1
              ;;
          esac
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:nightly"
          docker buildx imagetools inspect "$IMAGE:$dated_tag"
