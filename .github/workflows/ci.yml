name: CI

# Builds every base from bases.json for both architectures and runs the
# smoke test, without publishing. Uses the current upstream release, so a
# failure can also mean upstream changed.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      bases: ${{ steps.bases.outputs.bases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test publication logic
        run: prove scripts/*.t
      - name: List bases
        id: bases
        run: echo "bases=$(jq -c 'map({name, image})' bases.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJSON(needs.check.outputs.bases) }}
        arch: [amd64, arm64]
    name: build (${{ matrix.base.name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          build-args: BASE_IMAGE=${{ matrix.base.image }}
          tags: moonbit:ci
          load: true
      - name: Smoke test
        env:
          ENGINE: docker
        run: ./test.sh moonbit:ci
