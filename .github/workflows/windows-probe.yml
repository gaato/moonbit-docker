name: Probe MoonBit on Windows Server Core LTSC 2025

on:
  push:
    branches: [experiment/windows-servercore-2025]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm Windows container engine
        shell: pwsh
        run: |
          $engine = docker info --format '{{.OSType}}' 2>$null
          if ($engine -ne 'windows') {
            Restart-Service docker
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              $engine = docker info --format '{{.OSType}}' 2>$null
              if ($engine -eq 'windows') { break }
            }
          }
          if ($engine -ne 'windows') { throw 'Windows container engine is unavailable' }
          Get-PSDrive C
      - name: Build local probe image
        shell: pwsh
        run: docker build --pull --memory 2GB -f experiments/windows/Dockerfile -t moonbit-windows-probe .
      - name: Smoke test native build in container
        shell: pwsh
        run: docker run --rm moonbit-windows-probe cmd /S /C C:\smoke.cmd
