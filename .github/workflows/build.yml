name: Build

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact upstream version to rebuild. Empty: build unpublished bases of the current release.'
        required: false
        default: ""
      base:
        description: 'Base name from bases.json, or all'
        required: false
        default: all

concurrency:
  group: build
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.prepare.outputs.build }}
      version: ${{ steps.prepare.outputs.version }}
      latest: ${{ steps.prepare.outputs.latest }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test publication logic
        run: prove scripts/*.t
      - name: Select bases
        id: prepare
        env:
          CHANNEL: release
          INPUT_BASE: ${{ inputs.base }}
          INPUT_VERSION: ${{ inputs.version }}
        run: perl scripts/release.pl prepare

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    uses: ./.github/workflows/base.yml
    permissions:
      contents: read
      packages: write
    with:
      base: ${{ matrix.name }}
      image: ${{ matrix.image }}
      version: ${{ needs.check.outputs.version }}
      latest: ${{ needs.check.outputs.latest == 'true' }}

  record:
    needs: [check, build]
    # Preserve successful publications even when another base fails.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/receipts
          pattern: published-*
          merge-multiple: true
      - name: Record successful bases
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGETS: ${{ needs.check.outputs.matrix }}
          RECEIPT_DIR: ${{ runner.temp }}/receipts
        run: perl scripts/release.pl record
